<style>
    /* --- CSS RESET & BASE STYLES --- */
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0d0d0d;
        color: #f5f5f7;
        line-height: 1.6;
        overflow-x: hidden;
    }

    /* --- SITE HEADER & NAVIGATION --- */
    #site-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 48px;
        z-index: 1000;
        background: linear-gradient(to bottom, rgba(13,13,13,0.8), transparent);
        transition: background-color 0.4s ease, padding 0.4s ease;
    }

    #site-header.scrolled {
        background: rgba(13, 13, 13, 0.95);
        backdrop-filter: blur(10px);
        padding: 16px 48px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-logo {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #fff;
        text-decoration: none;
    }

    .nav-triggers {
        display: flex;
        gap: 32px;
    }

    .nav-trigger-btn {
        background: none;
        border: none;
        color: #a1a1a6;
        font-size: 0.95rem;
        cursor: pointer;
        transition: color 0.3s ease;
        font-weight: 400;
    }

    .nav-trigger-btn:hover, .nav-trigger-btn.active {
        color: #fff;
    }

    .mobile-menu-toggle {
        display: none;
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 8px 16px;
        font-size: 0.85rem;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    /* --- FULLSCREEN MEGAMENU OVERLAY --- */
    .megamenu-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: rgba(13, 13, 13, 0.98);
        z-index: 1100;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .megamenu-overlay.open {
        opacity: 1;
        visibility: visible;
    }

    .menu-close {
        position: absolute;
        top: 32px;
        right: 48px;
        background: none;
        border: none;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .megamenu-content {
        display: none;
        width: 80%;
        max-width: 1000px;
        grid-template-columns: 1fr 1fr;
        gap: 64px;
        align-items: center;
    }

    .megamenu-content.active-panel {
        display: grid;
    }

    .menu-col-left h3 {
        font-size: 2.25rem;
        font-weight: 400;
        margin-bottom: 16px;
        letter-spacing: -0.02em;
    }

    .menu-col-left p {
        color: #86868b;
        font-size: 1rem;
        line-height: 1.5;
    }

    .menu-links-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .menu-links-list li a {
        color: #f5f5f7;
        text-decoration: none;
        font-size: 1.75rem;
        font-weight: 300;
        transition: color 0.3s ease, padding-left 0.3s ease;
    }

    .menu-links-list li a:hover {
        color: #d4af37;
        padding-left: 8px;
    }

    /* --- HERO BANNER SECTION --- */
    .hero-banner {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
    }

    .hero-media {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .hero-media video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
    }

    .hero-content {
        position: relative;
        z-index: 2;
        max-width: 800px;
        padding: 0 24px;
    }

    .hero-content h1 {
        font-size: 3.5rem;
        font-weight: 400;
        letter-spacing: -0.03em;
        margin-bottom: 20px;
        color: #fff;
    }

    .hero-content p {
        font-size: 1.15rem;
        color: #d2d2d7;
        font-weight: 300;
        line-height: 1.6;
    }

    /* --- BRAND HISTORY SECTION --- */
    .brand-history {
        padding: 120px 48px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 80px;
        align-items: center;
        max-width: 1400px;
        margin: 0 auto;
    }

    .history-text h2 {
        font-size: 2.5rem;
        font-weight: 400;
        line-height: 1.2;
        margin-bottom: 24px;
        letter-spacing: -0.02em;
    }

    .history-text p {
        color: #86868b;
        font-size: 1.05rem;
        margin-bottom: 16px;
    }

    .history-image-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
    }

    .history-img {
        width: 100%;
        height: 380px;
        object-fit: cover;
        border-radius: 4px;
    }

    .history-img:nth-child(2) {
        margin-top: 40px;
    }

    /* --- COLLECTION TICKER SECTION --- */
    .collection-section {
        padding: 80px 0;
        background: #09090b;
        overflow: hidden;
    }

    .section-header {
        padding: 0 48px 40px 48px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .section-header h2 {
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: -0.01em;
    }

    .ticker-container {
        display: flex;
        width: 100%;
        overflow-x: auto;
        scrollbar-width: none; /* Firefox */
    }

    .ticker-container::-webkit-scrollbar {
        display: none; /* Safari and Chrome */
    }

    .ticker-track {
        display: flex;
        gap: 20px;
        padding: 0 24px;
        animation: tickerScroll 40s linear infinite;
    }

    .product-card {
        flex: 0 0 auto;
        width: 320px;
    }

    .product-image-container {
        width: 100%;
        height: 400px;
        border-radius: 4px;
        overflow: hidden;
    }

    .product-image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
    }

    .product-card:hover .product-image-container img {
        transform: scale(1.04);
    }

    @keyframes tickerScroll {
        0% {
            transform: translateX(0);
        }
        100% {
            transform: translateX(-50%);
        }
    }

    /* --- PRE-FOOTER VIDEO SECTION --- */
    .prefooter-video-section {
        padding: 40px 48px 120px 48px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .prefooter-video-container {
        position: relative;
        width: 100%;
        height: 500px;
        border-radius: 6px;
        overflow: hidden;
    }

    .prefooter-video-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .prefooter-video-caption {
        position: absolute;
        bottom: 40px;
        left: 40px;
        z-index: 2;
    }

    .prefooter-video-caption span {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #d4af37;
        display: block;
        margin-bottom: 8px;
    }

    .prefooter-video-caption h3 {
        font-size: 2rem;
        font-weight: 400;
        color: #fff;
    }

    /* --- FOOTER STYLES --- */
    footer {
        background: #050505;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding: 80px 48px 40px 48px;
    }

    .footer-grid {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 60px;
    }

    .footer-heading {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #86868b;
        margin-bottom: 20px;
    }

    .footer-links-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .footer-links-list li a {
        color: #f5f5f7;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 300;
        transition: color 0.3s ease;
    }

    .footer-links-list li a:hover {
        color: #d4af37;
    }

    .footer-bottom-bar {
        max-width: 1400px;
        margin: 80px auto 0 auto;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: #636366;
    }
</style>
